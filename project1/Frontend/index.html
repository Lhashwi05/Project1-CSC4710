<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Project 1 new</title>
</head>
<body>
  <main>
    
      <section>
    <h2>Create an account</h2>
    <!-- registration input names match the fields expected by POST /register. -->
    <form id="register-form"
          action="http://localhost:5050/register"
          method="post">

        <p>
            <label>Username:
                <input name="username" maxlength="50"
                       autocomplete="username" required>
            </label>
        </p>

        <p>
            <label>Password:
                <input name="password" type="password"
                       minlength="8" maxlength="128"
                       autocomplete="new-password" required>
            </label>
        </p>

        <p>
            <label>First name:
                <input name="firstname" maxlength="50" required>
            </label>
        </p>

        <p>
            <label>Last name:
                <input name="lastname" maxlength="50" required>
            </label>
        </p>

        <p>
            <label>Salary:
                <input name="salary" type="number"
                       min="0" max="9999999999.99"
                       step="0.01" required>
            </label>
        </p>

        <p>
            <label>Age:
                <input name="age" type="number"
                       min="0" max="130" step="1" required>
            </label>
        </p>

        <button type="submit">Register</button>
    </form>
    <!-- index.js displays registration success or error messages here. -->
    <p id="register-message" role="status"></p>

    <hr>

<section>
    <h2>Sign in</h2>

    <form id="login-form"
          action="http://localhost:5050/login"
          method="post">

        <p>
            <label>Username:
                <input name="username"
                       maxlength="50"
                       autocomplete="username"
                       required>
            </label>
        </p>

        <p>
            <label>Password:
                <input name="password"
                       type="password"
                       maxlength="128"
                       autocomplete="current-password"
                       required>
            </label>
        </p>

        <button type="submit">Sign in</button>
    </form>

    <!-- JavaScript displays sign-in feedback here. -->
    <p id="login-message" role="status"></p>
</section>
</main>
<!-- defer runs the script after the HTML is parsed so it can find the form. -->
<script src="index.js" defer></script></body>
</html>
