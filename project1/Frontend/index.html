<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Project 1 new</title>
</head>
<body>
  <main>
    
      <section>
    <h2>Create an account</h2>
    <!-- registration input names match the fields expected by POST /register. -->
    <form id="register-form"
          action="http://localhost:5050/register"
          method="post">

        <p>
            <label>Username:
                <input name="username" maxlength="50"
                       autocomplete="username" required>
            </label>
        </p>

        <p>
            <label>Password:
                <input name="password" type="password"
                       minlength="8" maxlength="128"
                       autocomplete="new-password" required>
            </label>
        </p>

        <p>
            <label>First name:
                <input name="firstname" maxlength="50" required>
            </label>
        </p>

        <p>
            <label>Last name:
                <input name="lastname" maxlength="50" required>
            </label>
        </p>

        <p>
            <label>Salary:
                <input name="salary" type="number"
                       min="0" max="9999999999.99"
                       step="0.01" required>
            </label>
        </p>

        <p>
            <label>Age:
                <input name="age" type="number"
                       min="0" max="130" step="1" required>
            </label>
        </p>

        <button type="submit">Register</button>
    </form>
    <!-- index.js displays registration success or error messages here. -->
    <p id="register-message" role="status"></p>

    <hr>

<section>
    <h2>Sign in</h2>

    <form id="login-form"
          action="http://localhost:5050/login"
          method="post">

        <p>
            <label>Username:
                <input name="username"
                       maxlength="50"
                       autocomplete="username"
                       required>
            </label>
        </p>

        <p>
            <label>Password:
                <input name="password"
                       type="password"
                       maxlength="128"
                       autocomplete="current-password"
                       required>
            </label>
        </p>

        <button type="submit">Sign in</button>
    </form>

    <!-- JavaScript displays sign-in feedback here. -->
    <p id="login-message" role="status"></p>
</section>

<hr>

<section>
    <h2>Search users</h2>
    <p>Sign in, then enter a first name, last name, or both.</p>

    <form id="search-form"
          action="http://localhost:5050/users/search"
          method="get">

        <p>
            <label>First name:
                <input name="firstname" maxlength="50">
            </label>
        </p>

        <p>
            <label>Last name:
                <input name="lastname" maxlength="50">
            </label>
        </p>

        <button type="submit">Search</button>
    </form>

    <p id="search-message" role="status"></p>

    <!-- Matching users are added to the table by index.js. -->
    <table id="search-results" hidden>
        <thead>
            <tr>
                <th scope="col">Username</th>
                <th scope="col">First name</th>
                <th scope="col">Last name</th>
            </tr>
        </thead>
        <tbody id="search-results-body"></tbody>
    </table>
</section>
<!--8-users who never signed in -->
<hr>

<section>
    <h2>Users Who Never Signed In</h2>
    <p>Lists every user whose sign-in time is empty.</p>

    <button type="button" id="never-signed-in-button">
        Find Users Who Never Signed In
    </button>

    <p id="never-signed-in-message" role="status"></p>
    <div id="never-signed-in-results"></div>
</section>

<!--9-users who registered on the same day as John -->
<hr>

<section>
    <h2>Registered Same Day As User</h2>

    <form id="same-day-form">
        <p>
            <label>Username:
                <input id="same-day-username" maxlength="50">
            </label>
        </p>

        <button type="submit">
            Registered Same Day
        </button>
    </form>

    <p id="same-day-message" role="status"></p>
    <div id="same-day-results"></div>
</section>

<!--10-users who registered today-->
<hr>

<section>
    <h2>Registered Today</h2>

    <button type="button" id="registered-today-button">
        Find Users Registered Today
    </button>

    <p id="registered-today-message" role="status"></p>
    <div id="registered-today-results"></div>
</section>






</main>
<!-- defer runs the script after the HTML is parsed so it can find the form. -->
<script src="index.js" defer></script></body>
</html>
